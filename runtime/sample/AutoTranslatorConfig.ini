[Service]
Endpoint=
FallbackEndpoint=

[General]
Language=zh-CN
FromLanguage=en

[Files]
Directory=Translation\{Lang}\Text
OutputFile=Translation\{Lang}\Text\_AutoGeneratedTranslations.txt

[TextFrameworks]
EnableUGUI=True
EnableTextMeshPro=True
EnableUIElements=False
EnableNGUI=False
EnableTextMesh=False
EnableIMGUI=False

[Behaviour]
MaxCharactersPerTranslation=2500
IgnoreWhitespaceInDialogue=True
MinDialogueChars=20
MaxTextParserRecursion=64
EnableUIResizing=True
ForceUIResizing=False
UseStaticTranslations=False
FallbackFontTextMeshPro=arialuni_sdf_u2018

[Texture]
EnableTextureTranslation=False
